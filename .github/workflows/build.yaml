# Pull requests: build + smoke test (a wrong BW_SHA256 fails the build). main: also push
# ghcr.io/webend-uk/bitwarden-cli:<bw version> and :sha-<commit>.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version from the Dockerfile
        id: version
        run: echo "bw=$(sed -n 's/^ARG BW_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64
          load: true
          tags: bitwarden-cli:smoke
      # No vault here: checks the binary, the user and the entrypoint, not a login.
      - name: Smoke test
        env:
          BW: ${{ steps.version.outputs.bw }}
        run: |
          set -euo pipefail
          got=$(docker run --rm --read-only --tmpfs /tmp --tmpfs /home/bw/data:uid=1000,gid=1000 \
            --entrypoint bw bitwarden-cli:smoke --version)
          echo "bw --version: $got"
          test "$got" = "$BW"
          test "$(docker run --rm --entrypoint id bitwarden-cli:smoke -u)" = 1000
          # Without BW_* the entrypoint must start and stop at its own check.
          if out=$(docker run --rm bitwarden-cli:smoke 2>&1); then
            echo "entrypoint ran without BW_HOST"; exit 1
          fi
          echo "$out"
          grep -q 'BW_HOST' <<<"$out"
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/webend-uk/bitwarden-cli:${{ steps.version.outputs.bw }}
            ghcr.io/webend-uk/bitwarden-cli:sha-${{ github.sha }}
